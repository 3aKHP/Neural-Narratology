name: Release Vesicle Harness Pack

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example harness-20260713-1"
        required: true
        type: string
      title:
        description: "Release title"
        required: true
        type: string
      notes:
        description: "Release notes"
        required: false
        type: string
      prerelease:
        description: "Mark this release as a prerelease"
        required: true
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Validate release target
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^harness-[0-9]{8}-[1-9][0-9]*$ ]]; then
            echo "Invalid Harness release tag: $RELEASE_TAG" >&2
            exit 1
          fi
          if git rev-parse --verify --quiet "refs/tags/$RELEASE_TAG^{commit}" >/dev/null; then
            tag_commit="$(git rev-list -n1 "$RELEASE_TAG")"
            if [[ "$tag_commit" != "$GITHUB_SHA" ]]; then
              echo "Tag $RELEASE_TAG points to $tag_commit, not workflow commit $GITHUB_SHA" >&2
              exit 1
            fi
          fi

      - name: Install contract test dependencies
        run: bun install --frozen-lockfile

      - name: Validate rule assets and Prism Driver
        run: |
          bun shared/rule-assets/scripts/check.ts
          bun shared/prism-driver/scripts/check.ts
          bun test shared/rule-assets/tests shared/prism-driver/tests

      - name: Build Harness Pack
        run: |
          bun shared/rule-assets/scripts/build-harness.ts --out "$RUNNER_TEMP/prism-vesicle-harness"
          test "$(jq -r .sourceState "$RUNNER_TEMP/prism-vesicle-harness/manifest.json")" = clean

      - name: Package Harness Pack
        run: |
          set -euo pipefail
          export LC_ALL=C
          export TZ=UTC
          VERSION=$(jq -r .version "$RUNNER_TEMP/prism-vesicle-harness/manifest.json")
          TOPLEVEL="prism-vesicle-harness-v${VERSION}"
          mkdir -p "$RUNNER_TEMP/pkg/${TOPLEVEL}"
          cp -r "$RUNNER_TEMP/prism-vesicle-harness/." "$RUNNER_TEMP/pkg/${TOPLEVEL}/"
          cd "$RUNNER_TEMP/pkg"
          find "$TOPLEVEL" -exec touch -h -d '1980-01-01T00:00:00Z' {} +
          find "$TOPLEVEL" -type f -print | sort | zip -q -X "$RUNNER_TEMP/prism-vesicle-harness-${VERSION}.zip" -@
          jq -r --arg t "$TOPLEVEL" '.assets | to_entries[] | "\(.value)  \($t)/\(.key)"' "$RUNNER_TEMP/prism-vesicle-harness/manifest.json" > "$RUNNER_TEMP/SHA256SUMS-${VERSION}"
          MHASH=$(sha256sum "$RUNNER_TEMP/prism-vesicle-harness/manifest.json" | cut -d ' ' -f1)
          echo "${MHASH}  ${TOPLEVEL}/manifest.json" >> "$RUNNER_TEMP/SHA256SUMS-${VERSION}"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_TITLE: ${{ inputs.title }}
          RELEASE_NOTES: ${{ inputs.notes }}
          RELEASE_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail
          notes_file="$RUNNER_TEMP/harness-release-notes.md"
          if [[ -n "$RELEASE_NOTES" ]]; then
            printf '%s\n' "$RELEASE_NOTES" > "$notes_file"
          else
            printf '%s\n' "Prism Vesicle Harness Pack generated from $GITHUB_SHA." > "$notes_file"
          fi
          assets=(
            "$RUNNER_TEMP/prism-vesicle-harness-${VERSION}.zip"
            "$RUNNER_TEMP/SHA256SUMS-${VERSION}"
          )
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --title "$RELEASE_TITLE" --notes-file "$notes_file"
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
          else
            args=("$RELEASE_TAG" "${assets[@]}" --title "$RELEASE_TITLE" --notes-file "$notes_file" --target "$GITHUB_SHA")
            if [[ "$RELEASE_PRERELEASE" == true ]]; then
              args+=(--prerelease)
            fi
            gh release create "${args[@]}"
          fi
